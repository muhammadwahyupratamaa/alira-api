name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: alira_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: alira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alira_test -d alira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://alira_test:test_only_password@localhost:5432/alira_test
      CORS_ORIGIN: http://localhost:5173
      SWAGGER_ENABLED: 'false'
      JWT_ACCESS_SECRET: ci-test-secret-that-is-not-used-in-production
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_ISSUER: alira-api
      JWT_AUDIENCE: alira-web
      REFRESH_TOKEN_TTL_SECONDS: 604800
      REFRESH_COOKIE_NAME: alira_refresh
      BCRYPT_ROUNDS: 10
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate and generate Prisma Client
        run: npm run prisma:validate && npm run prisma:generate
      - name: Deploy test migrations
        run: npm run pretest:e2e
      - name: Check formatting, lint, and types
        run: npm run format:check && npm run lint && npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Collect unit coverage
        run: npm run test:cov
      - name: Run E2E tests
        run: npm run test:e2e:run
      - name: Build production application
        run: npm run build
      - name: Build and inspect Docker targets
        run: |
          docker build --target runtime -t alira-api:ci-runtime .
          docker build --target migration -t alira-api:ci-migration .
          test "$(docker image inspect alira-api:ci-runtime --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect alira-api:ci-runtime --format '{{join .Config.Cmd " "}}')" = "node dist/main.js"
